# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- id: ui-sidebar-browser
  # Desktop capability does not depend on the user's Profile name. The later
  # user patch can still disable the Browser explicitly.
  disabled: false

- insert:
    - id: p7-company-models
      name: dsh-plugin-p7-company-models
    # Registered, deliberately NOT selected: the web seam raises a hard
    # WEB_PROVIDER_CONFIGURED_UNAVAILABLE for a selected-but-unavailable provider,
    # so a host without a stored P7 key would lose web search entirely. Select it
    # per profile with DSH_WEB_SEARCH_PROVIDER=p7 once the key is enrolled.
    - id: p7-web-search
      name: dsh-plugin-p7-web-search
    - id: desktop-shell
      name: dsh-plugin-desktop-beta
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop-beta/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop-beta/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop-beta/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop-beta/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop-beta/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop-beta/updates

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
