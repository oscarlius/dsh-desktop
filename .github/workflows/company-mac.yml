name: Company macOS test installer

on:
  push:
    branches: ['company/mac-installer-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac-universal:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_MAC_SMOKE_ARCH: universal
      DSH_MAC_PACKAGE_COMPRESSION: normal
      DSH_COMPANY_PERSONAL_LOGIN_DISTRIBUTION: '1'
      DSH_COMPANY_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - name: Cache runtime and Electron downloads
        uses: actions/cache@v6
        with:
          path: |
            dsh-plugin-desktop-beta/.desktop-build/downloads
            dsh-plugin-desktop-beta/.desktop-build/runtime
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: company-mac-universal-${{ hashFiles('yarn.lock', 'dsh-plugin-desktop-beta/package.json', 'deepseek-harness/scripts/primary-runtime/lock.json') }}
      - run: yarn install --immutable
      - name: Verify committed Market and Agents Anywhere provenance
        run: |
          yarn market:check
          yarn aa:prepare-release --verify-release
      - name: Build company plugins and Desktop frontend
        run: |
          yarn workspace dsh-plugin-p7-company-models build
          yarn workspace dsh-plugin-p7-web-search build
          yarn workspace dsh-plugin-p7-mcp build
          yarn workspace dsh-plugin-desktop-beta check:mac-package:platform
      - name: Build and verify universal test DMG
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace dsh-plugin-desktop-beta dist:mac-smoke
      - name: Collect credential-free installer and provenance
        run: node scripts/collect-company-mac.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: P7-DSH-Mac-universal-${{ github.run_id }}
          path: dsh-plugin-desktop-beta/dist/mac-company/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
